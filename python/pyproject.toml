[project]
name = "apilens"
version = "0.1.0"
description = "Python bindings for ApiLens: check a TypeScript frontend against a Spring Boot API and explore change impact, with FastMCP tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.10"]

[dependency-groups]
dev = ["pytest>=8", "fastmcp>=2.10"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apilens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
