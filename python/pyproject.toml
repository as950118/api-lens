[project]
name = "api-lens"
version = "0.1.0"
description = "Find the frontend code a backend API change breaks: Python bindings and FastMCP tools for ApiLens (TypeScript frontend + Spring Boot backend)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Heonjin Jeong" }]
keywords = ["apilens", "api", "breaking-changes", "contract", "spring-boot", "typescript", "mcp", "fastmcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.10"]

[project.urls]
Homepage = "https://github.com/heonjinjeong/api-lens"
Repository = "https://github.com/heonjinjeong/api-lens"
Issues = "https://github.com/heonjinjeong/api-lens/issues"

[dependency-groups]
dev = ["pytest>=8", "fastmcp>=2.10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apilens"]

[tool.hatch.build.targets.sdist]
include = ["src/apilens", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
