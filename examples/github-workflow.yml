# .github/workflows/tacet.yml in the repository containing your frontend and backend.
name: Tacet

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # for the report comment

jobs:
  tacet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tacet reads the backend at the base ref
      - uses: <owner>/tacet@v1
        with:
          frontend: frontend
          backend: backend
          # Optional AI verification of the findings static analysis cannot decide:
          # ai-provider: anthropic
        # env:
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
